<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Editor de recetas · CRAFTERRA</title><style>body{font:15px system-ui;background:#0d1929;color:#eaf4ff;max-width:1100px;margin:auto;padding:24px}a{color:#70e1a1}header{display:flex;justify-content:space-between}section{background:#172a40;padding:18px;border-radius:18px;margin:15px 0}label{display:grid;gap:5px}form{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}input,select,button,textarea{font:inherit;padding:10px;border-radius:9px;border:1px solid #456;background:#0d1929;color:white}button{background:#277b5c}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px;border-bottom:1px solid #ffffff18}.bad{color:#ff8b83}.good{color:#70e1a1}@media(max-width:700px){form{grid-template-columns:1fr 1fr}table{font-size:11px}}</style></head><body><header><div><small>HERRAMIENTA OFFLINE</small><h1>Editor de recetas</h1></div><a href="../index.html">← Volver al juego</a></header><section><form id="form"><label>Ingrediente A<select id="a"></select></label><label>Ingrediente B<select id="b"></select></label><label>Resultado<select id="result"></select></label><label>Estación<select id="station"></select></label><label>XP<input id="xp" type="number" min="0" value="20"></label><label>Monedas<input id="reward" type="number" min="0" value="25"></label><label>Rareza<select id="rarity"><option>COMÚN</option><option>INUSUAL</option><option>RARO</option><option>ÉPICO</option><option>LEGENDARIO</option><option>SECRETO</option></select></label><label>Era<input id="era" type="number" min="1" max="7" value="1"></label><button type="submit">Añadir receta local</button><button type="button" id="validate">Validar y balancear</button><button type="button" id="export">Exportar JSON</button><button type="button" id="clear">Descartar cambios</button></form></section><section><h2>Informe</h2><div id="report"></div></section><section><h2>Recetas <span id="count"></span></h2><table><thead><tr><th>ID</th><th>Ingredientes</th><th>Resultado</th><th>Era</th><th>Economía</th></tr></thead><tbody id="rows"></tbody></table></section><script type="module" src="editor.js"></script></body></html>
