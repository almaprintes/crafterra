name: Crafterra - validar main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar catálogo y PWA
        run: node tests/validate.mjs
      - name: Verificar mundo isométrico
        run: node tests/adventure.mjs
      - name: Validar progresión de piedra y metalurgia
        run: node tests/metallurgy.mjs
      - name: Verificar interfaz premium y acción
        run: node tests/adventure-ui.mjs
      - name: Validar taller sin scroll anidado
        run: node tests/craft-layout.mjs
      - name: Validar hábitats, fauna y galerías minerales
        run: node tests/biomes.mjs
      - name: Verificar texturas del terreno, relieve y sombras
        run: node tests/terrain-textures.mjs
      - name: Comprobar sintaxis del arranque y motor
        run: |
          node --check js/app.js
          node --check js/adventure-world.js
          node --check js/terrain-textures.js
          node --check js/adventure-art.js
          node --check js/world-actions.js
          node --check js/world-biomes.js
          node --check js/material-economy.js
          node --check js/adventure-rules.js
          node --check js/engine.js
