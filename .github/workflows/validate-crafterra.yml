name: Crafterra - validar main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar catálogo y PWA
        run: node tests/validate.mjs
      - name: Verificar mundo isométrico
        run: node tests/adventure.mjs
