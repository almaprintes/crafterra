<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#101b2d"><meta name="description" content="CRAFTERRA — De una piedra a las estrellas."><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="assets/icon.svg"><link rel="stylesheet" href="css/game.css"><title>CRAFTERRA</title></head><body>
<div id="splash"><img src="assets/logo.svg" alt="CRAFTERRA"><div class="loader"></div></div>
<div id="app" hidden><header><button class="brand" data-view="world"><img src="assets/icon.svg" alt=""><span>CRAFTERRA<small>v0.1.0</small></span></button><div class="wallet"><span class="coin"></span><b id="coins">0</b><span>◆</span><b id="level">1</b></div><button class="iconbtn" id="settingsBtn" aria-label="Ajustes">⚙</button></header>
<main><section id="view-world" class="view active"><div class="world-head"><div><small id="eraLabel">ERA I</small><h1 id="eraName">Naturaleza</h1><p id="missionHint">Arrastra un objeto sobre otro.</p></div><button id="dailyBtn" class="daily">DESAFÍO<br><b>DIARIO</b></button></div><div id="world" aria-label="Mundo evolutivo"><div class="sky"></div><div id="worldTiles"></div><div id="worldBuildings"></div></div><div id="questStrip"></div></section>
<section id="view-craft" class="view"><div class="panel-title"><div><small>TALLER</small><h2>Laboratorio de ideas</h2></div><button id="clearBoard">Limpiar</button></div><div id="stationBar"></div><div id="craftBoard" aria-label="Mesa de crafting"><p class="board-help">Toca recursos para añadirlos. Arrastra una pieza sobre otra para fusionar.</p></div><div class="inventory"><div class="inventory-head"><b>INVENTARIO</b><input id="itemSearch" placeholder="Buscar" aria-label="Buscar objeto"></div><div id="inventoryGrid"></div></div></section>
<section id="view-book" class="view"><div class="panel-title"><div><small>ARCHIVO DEL INVENTOR</small><h2>Enciclopedia</h2></div><b id="bookCount"></b></div><div id="filters" class="filters"></div><div id="bookGrid" class="book-grid"></div></section>
<section id="view-goals" class="view"><div class="panel-title"><div><small>RUMBO AL FUTURO</small><h2>Misiones y puzles</h2></div></div><div class="tabs"><button class="selected" data-goal="missions">Misiones</button><button data-goal="puzzles">Puzles</button><button data-goal="collections">Colecciones</button><button data-goal="achievements">Logros</button></div><div id="goalsList"></div></section>
<section id="view-shop" class="view"><div class="panel-title"><div><small>SUMINISTROS</small><h2>Tienda del inventor</h2></div></div><div id="shopList"></div></section></main>
<nav><button data-view="world" class="active"><i>⌂</i>Mundo</button><button data-view="craft"><i>◇</i>Crear</button><button data-view="book"><i>▦</i>Archivo</button><button data-view="goals"><i>★</i>Retos</button><button data-view="shop"><i>◆</i>Tienda</button></nav></div>
<div id="modal" class="modal" hidden><div class="modal-card"><button id="modalClose" class="close">×</button><div id="modalBody"></div></div></div><div id="toast"></div>
<script type="module" src="js/app.js"></script></body></html>
